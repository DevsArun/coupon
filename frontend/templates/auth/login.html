<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CouponAI</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <div style="width:100%;max-width:400px;padding:32px;">
        <div style="text-align:center;margin-bottom:32px;">
            <a href="/" class="logo" style="font-size:28px;">Coupon<span>AI</span></a>
            <p style="color:var(--text-secondary);margin-top:8px;font-size:14px;">Sign in to your account</p>
        </div>
        <form id="login-form" onsubmit="handleLogin(event)">
            <div style="margin-bottom:16px;">
                <label style="display:block;color:var(--text-secondary);font-size:13px;margin-bottom:6px;">Email</label>
                <input type="email" id="email" class="input" placeholder="you@email.com" required>
            </div>
            <div style="margin-bottom:24px;">
                <label style="display:block;color:var(--text-secondary);font-size:13px;margin-bottom:6px;">Password</label>
                <input type="password" id="password" class="input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;" id="login-btn">Sign In</button>
        </form>
        <p style="text-align:center;margin-top:20px;color:var(--text-muted);font-size:13px;">
            Don't have an account? <a href="/register" style="color:var(--accent);">Create one</a>
        </p>
        <div id="login-error" style="margin-top:16px;text-align:center;color:var(--error);font-size:13px;display:none;"></div>
    </div>
    <script src="/static/js/app.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errEl = document.getElementById('login-error');
            btn.textContent = 'Signing in...';
            errEl.style.display = 'none';
            try {
                const data = await api.post('/auth/login', {
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                }, false);
                Auth.setAuth(data);
                if (data.user.role === 'super_admin' || data.user.role === 'admin') {
                    window.location.href = '/admin';
                } else {
                    window.location.href = '/app';
                }
            } catch (err) {
                errEl.textContent = err.message;
                errEl.style.display = 'block';
                btn.textContent = 'Sign In';
            }
        }
    </script>
</body>
</html>
